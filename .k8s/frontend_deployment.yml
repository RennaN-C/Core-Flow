apiVersion: apps/v1
kind: Deployment
metadata:
  name: coreflow-front-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: coreflow-front

  template:
    metadata:
      labels:
        app: coreflow-front

    spec:
      containers:
        - name: coreflow-front
          image: rennanmk9/coreflow-front:1.0.17

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80
