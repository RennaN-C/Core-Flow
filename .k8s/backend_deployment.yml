apiVersion: apps/v1
kind: Deployment
metadata:
  name: coreflow-api-deployment
  labels:   
    app: coreflow-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coreflow-api
  template:
    metadata:
      labels:
        app: coreflow-api
    spec:
      containers:
      - name: coreflow-api
        image: rennanmk9/coreflow-api:1.0.3
        imagePullPolicy: Always #
        ports:
        - containerPort: 3000
        env:
        - name: DB_HOST
          value: "postgres" 
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_NAME
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: JWT_SECRET
